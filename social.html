  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<body class="show-page" id="top">
  <!-- NAV -->
  <header class="nav">
    <a class="nav-mark" href="index.html">← CN—PRD</a>
    <nav class="nav-right">
      <a href="index.html">Work</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <!-- VERTICAL GRID -->
  <section class="show" id="show">
    <span class="panel-label">[ SOCIAL ]</span>
    <h1 class="show-title"><span class="concert-artist">Social</span> <span class="concert-meta" id="socialCount"></span></h1>
    <div class="social-grid" id="socialGrid"></div>
  </section>

  <!-- VERTICAL PLAYER -->
  <div class="plight" id="plight" hidden>
    <button class="plight-nav prev" id="plightPrev" aria-label="Previous">‹</button>
    <button class="plight-nav next" id="plightNext" aria-label="Next">›</button>
    <div class="plight-stage" id="plightStage">
      <div class="plight-video" id="plightVideo"></div>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
    <button class="plight-close" id="plightClose" aria-label="Close">CLOSE ✕</button>
    <div class="plight-meta"><span id="plightCaption"></span><span id="plightCount"></span></div>
  </div>

  <script src="social.js?v=95"></script>
  <script src="social-page.js?v=95"></script>
