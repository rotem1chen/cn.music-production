<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Treatment — CN PROD</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/png" href="favicon.png?v=1" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#000; --ink:#f4f4f2; --muted:rgba(244,244,242,0.42); --line:rgba(244,244,242,0.16); --accent:#ffd400;
            --ui:"Oswald","Karantina",system-ui,sans-serif; --display:"Karantina","Oswald",system-ui,sans-serif; }
    * { box-sizing: border-box }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink) }
    body { font-family: var(--ui); -webkit-font-smoothing: antialiased }

    /* the treatment itself fills the window; it carries its own styling */
    #doc { display: block; width: 100%; height: 100%; border: 0; background: var(--bg) }
    #doc[hidden] { display: none }

    .state { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; text-align: center; padding: 32px 16px }
    .state[hidden] { display: none }
    .mark { font: 600 13px var(--ui); letter-spacing: 0.2em; color: var(--accent) }
    .headline { font: 700 clamp(28px,6vw,48px)/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; margin: 0 }
    .note { font: 600 11px var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      max-width: 44ch; line-height: 1.9 }
    .bar { width: min(280px, 70vw); height: 1px; background: var(--line); overflow: hidden }
    .bar i { display: block; height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite }
    @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(340%) } }
    @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100% } }
    a.act { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; padding: 12px 16px;
      border: 1px solid var(--line); color: var(--accent); text-decoration: none;
      font: 600 11px var(--ui); letter-spacing: 0.14em; text-transform: uppercase }
    a.act:hover { border-color: var(--accent) }

    /* liquid: studio light behind the waiting / error states, glass on top */
    html { background: #000 } body { background: transparent }
    body::before { content: ""; position: fixed; inset: -12%; z-index: -1; pointer-events: none;
      background: radial-gradient(38% 42% at 30% 28%, rgba(255,212,0,.55), transparent 70%),
                  radial-gradient(42% 48% at 76% 72%, rgba(255,110,20,.45), transparent 70%),
                  radial-gradient(36% 40% at 18% 88%, rgba(110,60,255,.38), transparent 70%);
      filter: blur(80px) saturate(1.5) brightness(.5) }
    .state > * { position: relative }
    .state:not([hidden])::before { content: ""; position: absolute; width: min(520px, 90vw); height: 300px; border-radius: 28px; z-index: -1;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
      -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 0 0 1px rgba(255,255,255,.08), 0 30px 80px -20px rgba(0,0,0,.7) }
    .state { position: relative; isolation: isolate }
    .bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.1) }
    .bar i { border-radius: 3px; box-shadow: 0 0 14px rgba(255,212,0,.8) }
    a.act { border: 0; border-radius: 999px; padding: 13px 20px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.035));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 0 0 1px rgba(255,255,255,.08), 0 10px 28px rgba(0,0,0,.35) }
    a.act:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 0 0 1px rgba(255,212,0,.5), 0 0 26px rgba(255,212,0,.2) }
    #doc { background: transparent }
  </style>
</head>
<body>
  <iframe id="doc" title="Director's treatment" hidden
          sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>

  <div class="state" id="state">
    <span class="mark">CN&mdash;PRD</span>
    <h1 class="headline" id="stateTitle">Opening treatment</h1>
    <div class="bar" id="stateBar"><i></i></div>
    <p class="note" id="stateNote">Fetching the document from Drive.</p>
    <a class="act" id="stateAct" hidden target="_blank" rel="noopener"><span>Open in Drive</span><span>&#8599;</span></a>
  </div>

  <script src="media-config.js?v=2"></script>
  <script src="t.js?v=1"></script>
</body>
</html>
