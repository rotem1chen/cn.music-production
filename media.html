<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CN PROD — Media</title>
  <meta name="description" content="Client media delivery — CN PROD." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="favicon.png?v=1" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=94" />
</head>
<body class="show-page pool-page" id="top">
  <!-- NAV -->
  <header class="nav">
    <a class="nav-mark" href="index.html">CN—PRD</a>
    <nav class="nav-right">
      <a href="index.html">Work</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <!-- MEDIA POOL -->
  <section class="pool" id="pool">
    <div class="pool-head">
      <img class="pool-logo" src="logo.png?v=12" alt="CN PROD" />
      <span class="panel-label">[ MEDIA POOL ]</span>
      <h1 class="show-title pool-title" id="poolTitle">Loading…</h1>
      <div class="pool-actions" id="poolActions" hidden>
        <a class="pool-btn primary" id="poolZip" href="#" target="_blank" rel="noopener">
          <span class="ec tl"></span><span class="ec tr"></span><span class="ec bl"></span><span class="ec br"></span>
          <span>Download all</span><span class="ar">↓</span>
        </a>
        <a class="pool-btn ghost" id="poolDrive" href="#" target="_blank" rel="noopener">
          <span>Open in Drive</span><span class="ar">↗</span>
        </a>
      </div>
      <div class="pool-status" id="poolStatus"></div>
    </div>
    <div id="poolBody"></div>
  </section>

  <!-- VIDEO PLAYER -->
  <div class="vplay" id="vplay" hidden>
    <div class="vplay-stage" id="vplayStage">
      <video id="vplayVideo" class="vplay-video" playsinline controls preload="metadata" hidden></video>
      <div class="vload" id="vLoad" hidden>
        <img class="vload-poster" id="vLoadPoster" alt="" hidden />
        <div class="vload-box">
          <span class="vload-pct" id="vLoadPct">0%</span>
          <div class="vload-bar"><i id="vLoadFill"></i></div>
          <span class="vload-meta" id="vLoadMeta"></span>
        </div>
      </div>
      <iframe id="vplayFrame" allow="autoplay; fullscreen" allowfullscreen title="Video" hidden></iframe>
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
    <button class="plight-close" id="vplayClose" aria-label="Close">CLOSE ✕</button>
    <div class="plight-meta"><span id="vplayCaption"></span><a id="vplayDl" href="#" target="_blank" rel="noopener">Download ↓</a></div>
  </div>

  <!-- PHOTO LIGHTBOX -->
  <div class="plight" id="plight" hidden>
    <button class="plight-nav prev" id="plightPrev" aria-label="Previous">‹</button>
    <button class="plight-nav next" id="plightNext" aria-label="Next">›</button>
    <div class="plight-stage" id="plightStage">
      <img class="plight-img" id="plightImg" alt="" />
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>
    <button class="plight-close" id="plightClose" aria-label="Close">CLOSE ✕</button>
    <div class="plight-meta"><span id="plightCaption"></span><span><a id="plightDl" href="#" target="_blank" rel="noopener">Download ↓</a> &nbsp;&nbsp; <span id="plightCount"></span></span></div>
  </div>

  <script src="media-config.js?v=94"></script>
  <script src="media.js?v=94"></script>
</body>
</html>
